{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scholara - AI Research Assistant</title>
    {% csrf_token %}
    <meta name="clerk-publishable-key" content="{{ clerk_publishable_key }}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Inter:wght@400;450;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
    <link rel="stylesheet" href="{% static 'styles.css' %}" />
  </head>
  <body class="app-body">
    <script>(function(){try{var t=localStorage.getItem("scholara-theme");if(t==="dark")document.body.dataset.theme="dark";}catch(_){}})()</script>
    {% csrf_token %}
    <!-- Ambient background: viewport-fixed, decorative only. Purely a
         paint layer behind all real content -- see .ws-bg in styles.css
         and js/workspace-bg.js. Never affects layout or scroll height. -->
    <canvas class="ws-bg" data-ws-bg aria-hidden="true"></canvas>
    <!-- NAVBAR -->
    <nav class="navbar">
      <div class="navbar-container">
        <!-- Title -->
        <div class="navbar-title">
          <a href="/" class="logo" aria-label="Scholara home">
            <span class="logo-text">S</span>
          </a>
          <div>
            <h1 class="app-title">Scholara</h1>
            <p class="app-subtitle">Research Workspace</p>
          </div>
        </div>

        <!-- Account menu -->
        <div class="profile-section">
          <button id="themeToggle" class="theme-toggle" type="button"
                  aria-label="Switch to dark mode" title="Switch to dark mode">
            <svg class="theme-toggle__moon" viewBox="0 0 20 20" width="18" height="18"
                 fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
                 aria-hidden="true">
              <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"/>
            </svg>
            <svg class="theme-toggle__sun" viewBox="0 0 20 20" width="18" height="18"
                 fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
                 aria-hidden="true">
              <circle cx="10" cy="10" r="4"/>
              <line x1="10" y1="2" x2="10" y2="3.5"/>
              <line x1="10" y1="16.5" x2="10" y2="18"/>
              <line x1="2" y1="10" x2="3.5" y2="10"/>
              <line x1="16.5" y1="10" x2="18" y2="10"/>
              <line x1="4.929" y1="4.929" x2="5.99" y2="5.99"/>
              <line x1="14.01" y1="14.01" x2="15.071" y2="15.071"/>
              <line x1="4.929" y1="15.071" x2="5.99" y2="14.01"/>
              <line x1="14.01" y1="5.99" x2="15.071" y2="4.929"/>
            </svg>
          </button>
          <button
            id="profileTrigger"
            class="profile-button"
            type="button"
            aria-haspopup="true"
            aria-expanded="false"
            aria-controls="profileMenu"
          >
            <span id="profileAvatar" class="profile-avatar" aria-hidden="true">S</span>
            <span class="profile-info">
              <span id="profileName" class="profile-name">Loading&hellip;</span>
              <span id="profileRole" class="profile-role"></span>
            </span>
            <i class="fa-solid fa-chevron-down profile-chevron" aria-hidden="true"></i>
          </button>

          <div id="profileMenu" class="profile-dropdown" role="menu" aria-labelledby="profileTrigger" hidden>
            <a id="profileManage" class="profile-item" role="menuitem" tabindex="-1" hidden>
              <i class="fa-solid fa-user-gear" aria-hidden="true"></i>
              <span>Manage account</span>
            </a>
            <a id="profileSignIn" href="/sign-in/" class="profile-item" role="menuitem" tabindex="-1" hidden>
              <i class="fa-solid fa-right-to-bracket" aria-hidden="true"></i>
              <span>Sign in</span>
            </a>
            <a id="profileSignOut" class="profile-item profile-item--danger" role="menuitem" tabindex="-1" hidden>
              <i class="fa-solid fa-arrow-right-from-bracket" aria-hidden="true"></i>
              <span>Log out</span>
            </a>
          </div>
        </div>
      </div>
    </nav>

    <div class="nav-spacer"></div>
    <script type="module" src="{% static 'js/gate.js' %}"></script>
    <script type="module" src="{% static 'js/profile.js' %}"></script>
    <script type="module" src="{% static 'js/globals.js' %}"></script>
    <script type="module" src="{% static 'js/workspace-bg.js' %}"></script>
    <script type="module" src="{% static 'js/theme.js' %}"></script>
  </body>
</html>
