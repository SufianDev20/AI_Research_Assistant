    <!-- PAPER DETAIL VIEW -->
    <div id="paperView" class="paper-view">
      <!-- Top Bar -->
      <div class="paper-view-top-bar">
        <div class="paper-view-top-left">
          <button id="paperBackBtn" class="research-back-btn"><i class="fa-solid fa-arrow-left"></i></button>
          <div class="paper-view-title-wrap">
            <span id="paperViewTitle" class="paper-view-title"></span>
            <span id="paperViewMeta" class="paper-view-meta"></span>
          </div>
        </div>
        <div class="paper-view-top-right">
          <span id="paperOABadge" class="oa-badge" style="display:none">Open Access</span>
          <a id="paperDOILink" href="#" target="_blank" rel="noopener noreferrer" class="paper-doi-link" style="display:none"><i class="fa-solid fa-arrow-up-right-from-square"></i> View PDF</a>
        </div>
      </div>

      <!-- Three-column body -->
      <div class="paper-view-body">
        <!-- LEFT: Paper list sidebar -->
        <div class="paper-sidebar">
          <div class="paper-sidebar-header">
            <span class="paper-sidebar-title">Papers</span>
            <div class="paper-sidebar-filters">
              <button class="filter-btn active" data-psort="relevance">Relevance</button>
              <button class="filter-btn" data-psort="cited_by_count">Most Cited</button>
            </div>
          </div>
          <div id="paperSidebarList" class="paper-sidebar-list"></div>
        </div>

        <!-- CENTER: Content / extraction area -->
        <div class="paper-center">
          <div id="paperContent" class="paper-content">
            <!-- States: idle, loading, extracted, unavailable -->
            <div id="paperIdleState" class="paper-state">
              <i class="fa-solid fa-file-lines paper-state-icon"></i>
              <p class="paper-state-text">Select a paper from the sidebar to begin.</p>
            </div>
            <div id="paperLoadingState" class="paper-state" style="display:none">
              <i class="fa-solid fa-brain paper-state-icon" style="animation: pulse 2s infinite; color:#60a5fa"></i>
              <p class="paper-state-text">Extracting paper content...</p>
              <p class="paper-state-sub">This may take 10–30 seconds for large PDFs.</p>
            </div>
            <div id="paperExtractedState" style="display:none">
              <div id="paperMarkdown" class="paper-markdown"></div>
            </div>
            <div id="paperUnavailableState" class="paper-state" style="display:none">
              <i class="fa-solid fa-lock paper-state-icon" style="color:#94a3b8"></i>
              <p class="paper-state-text">Full text not available.</p>
              <p class="paper-state-sub">This paper is not open access. You can still ask general questions using the summary below.</p>
            </div>
          </div>
        </div>

        <!-- RIGHT: QA panel -->
        <div class="paper-qa-panel">
          <div class="paper-qa-header">
            <span class="paper-qa-title">Ask This Paper</span>
            <span id="paperQAStatus" class="paper-qa-status"></span>
          </div>
          <div id="paperQAChat" class="paper-qa-chat"></div>
          <div class="paper-qa-input-bar">
            <input id="paperQAInput" type="text" placeholder="Ask a question about this paper..." class="research-input" />
            <button id="paperQASendBtn" class="research-send-button"><i class="fa-solid fa-paper-plane"></i></button>
          </div>
        </div>
      </div>
    </div>
