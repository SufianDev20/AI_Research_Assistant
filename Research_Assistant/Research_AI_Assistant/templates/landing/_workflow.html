{% load static %}
<section class="sch-flow" id="workflow" data-flow aria-label="The research workflow">
  <div class="sch-wrap">
    <div class="sch-flow__head" data-reveal>
      <p class="sch-kicker">A living system</p>
      <p>Research moves in one direction &mdash; each step carries the last one forward.</p>
    </div>

    <div class="sch-flow__line">
      <div class="sch-stage">
        <span class="sch-stage__dot" aria-hidden="true"></span>
        <span class="sch-stage__k">01</span>
        <span class="sch-stage__t">Question</span>
      </div>
      <div class="sch-stage">
        <span class="sch-stage__dot" aria-hidden="true"></span>
        <span class="sch-stage__k">02</span>
        <span class="sch-stage__t">Discover</span>
      </div>
      <div class="sch-stage">
        <span class="sch-stage__dot" aria-hidden="true"></span>
        <span class="sch-stage__k">03</span>
        <span class="sch-stage__t">Read</span>
      </div>
      <div class="sch-stage">
        <span class="sch-stage__dot" aria-hidden="true"></span>
        <span class="sch-stage__k">04</span>
        <span class="sch-stage__t">Compare</span>
      </div>
      <div class="sch-stage">
        <span class="sch-stage__dot" aria-hidden="true"></span>
        <span class="sch-stage__k">05</span>
        <span class="sch-stage__t">Synthesize</span>
      </div>
      <div class="sch-stage">
        <span class="sch-stage__dot" aria-hidden="true"></span>
        <span class="sch-stage__k">06</span>
        <span class="sch-stage__t">Cite</span>
      </div>
    </div>
  </div>
</section>
