      <!-- RESEARCH INPUT WITH ATTACHED ADVANCED OPTIONS -->
      <div class="hero-section">
        <div class="hero-container">
          <div class="hero-label">
            <i class="fa-solid fa-feather-pointed"></i>
            <span>Ask Scholara</span>
          </div>

          <!-- Main Search Container -->
          <div class="search-card" id="wsSearchCard">
            <div class="search-input-section">
              <label for="queryInput" class="sr-only">Research topic</label>
              <input
                id="queryInput"
                type="text"
                placeholder="Enter a topic to research"
                autocomplete="off"
                class="search-input"
              />
              <button onclick="performSearch()" class="search-button" aria-label="Research this topic">
                <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
              </button>
            </div>

            <div class="ws-toggle-row">
              <button
                type="button"
                id="wsAdvancedToggle"
                class="ws-advanced-toggle"
                aria-expanded="false"
                aria-controls="wsAdvancedPanel"
              >
                <span>Advanced options</span>
                <i class="fa-solid fa-chevron-down ws-advanced-toggle__chev" aria-hidden="true"></i>
              </button>
            </div>
          </div>
          <!-- Deliberately a sibling of .search-card, not a child: the
               card's own rounded/shadowed background must never extend
               behind the open panel, or the sheets read as sitting
               inside one big enclosing box instead of hanging free
               against the page. -->
          <div class="ws-advanced-panel" id="wsAdvancedPanel" hidden>
              <!-- Shared paint servers for every sheet's paper shadow and every
                   ring's metal gradient below -- defined once, referenced by
                   url(#id) from each sheet/ring's own inline svg. -->
              <svg width="0" height="0" style="position: absolute" aria-hidden="true" focusable="false">
                <defs>
                  <!-- Two layers merged under the paper: a tight dark contact
                       shadow right at the edge, plus a wider, lower-opacity
                       diffuse fade -- per reference/picture 1.png, which shows
                       visible separation from the page background rather than
                       a single flat strip. Warm neutral flood color (not
                       near-black) so it reads as a soft shadow, not an outline.
                       Region is sized generously (-40%/180% x, -40%/260% y) so
                       the wide layer's blur has room; the real clip was the
                       svg element's own default overflow:hidden, fixed via
                       .ws-tab__paper{overflow:visible} in styles.css. -->
                  <filter id="wsPaperShadow" x="-50%" y="-50%" width="200%" height="320%">
                    <feGaussianBlur in="SourceAlpha" stdDeviation="2.5" result="tightBlur" />
                    <feOffset in="tightBlur" dx="0" dy="2" result="tightOffset" />
                    <feColorMatrix in="tightOffset" type="matrix"
                      values="0 0 0 0 0.33  0 0 0 0 0.30  0 0 0 0 0.26  0 0 0 0.5 0"
                      result="tightShadow" />
                    <feGaussianBlur in="SourceAlpha" stdDeviation="11" result="wideBlur" />
                    <feOffset in="wideBlur" dx="0" dy="7" result="wideOffset" />
                    <feColorMatrix in="wideOffset" type="matrix"
                      values="0 0 0 0 0.33  0 0 0 0 0.30  0 0 0 0 0.26  0 0 0 0.26 0"
                      result="wideShadow" />
                    <feMerge>
                      <feMergeNode in="wideShadow" />
                      <feMergeNode in="tightShadow" />
                      <feMergeNode in="SourceGraphic" />
                    </feMerge>
                  </filter>
                  <!-- Very restrained surface shading for the paper fill itself,
                       per reference/picture 1.png's gentle tonal variation:
                       barely darker at the very top, back to the base color by
                       18% down. Kept subtle: this is not meant to read as its
                       own visible gradient, just to stop the fill from looking
                       perfectly flat next to the now-visible cast shadow above it. -->
                  <linearGradient id="wsPaperFill" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#f1efe2" />
                    <stop offset="18%" stop-color="#f8f6ed" />
                    <stop offset="100%" stop-color="#f8f6ed" />
                  </linearGradient>
                  <!-- Traced directly from ring-target.png (user-supplied close-up of
                       reference/picture 1.png), with proportions cross-checked by pixel
                       sampling that image rather than estimated by eye. -->
                  <linearGradient id="wsRingMetal" gradientUnits="userSpaceOnUse" x1="5.5" y1="0" x2="10.5" y2="0">
                    <stop offset="0%" stop-color="#b9bdc0" />
                    <stop offset="22%" stop-color="#eef0f0" />
                    <stop offset="38%" stop-color="#c7cbce" />
                    <stop offset="65%" stop-color="#959b9f" />
                    <stop offset="100%" stop-color="#6d7377" />
                  </linearGradient>
                  <radialGradient id="wsRingHole" cx="0.38" cy="0.32" r="0.8">
                    <stop offset="0%" stop-color="#6e7479" />
                    <stop offset="45%" stop-color="#3f4448" />
                    <stop offset="100%" stop-color="#25282b" />
                  </radialGradient>
                  <filter id="wsRingEmboss" x="-60%" y="-30%" width="220%" height="160%">
                    <feDropShadow dx="0.2" dy="0.8" stdDeviation="0.6" flood-color="#2a2d1f" flood-opacity="0.3" />
                  </filter>
                </defs>
              </svg>
