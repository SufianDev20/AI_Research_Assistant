{% load static %}
<!-- RIGHT: Question & Analysis - a transcript of question/answer turns,
     each grounded in the selected papers, plus a composer for the next
     question. See analysis.js: renderTranscript(), appendTurn(),
     turnBodyHtml(), and static/js/analysis/analysis_api.js
     (requestPaperAnalysis) - the one function that calls the backend. -->
<section class="an-panel an-panel--qa" aria-labelledby="anQaHeading">
  <div class="an-panel__head">
    <p class="an-kicker" id="anQaHeading">Question &amp; Analysis</p>
  </div>

  <!-- One <article class="an-turn"> per question; analysis.js repaints only
       the turn that changed, never this whole container. -->
  <div
    class="an-qa__body an-transcript"
    id="anTranscript"
    role="status"
    aria-live="polite"
    aria-atomic="false"
  ></div>

  <form class="an-qa__composer" id="anComposer">
    <label for="anQuestionInput" class="an-sr-only">Ask another question about these papers</label>
    <input
      id="anQuestionInput"
      type="text"
      class="an-qa__input"
      placeholder="Ask another question about these papers…"
      autocomplete="off"
      maxlength="2000"
    />
    <button type="submit" class="an-qa__send" id="anQuestionSend" aria-label="Send question">
      {% include "landing/_icon.html" with name="arrow-right" cls="an-ico" %}
    </button>
  </form>
</section>
